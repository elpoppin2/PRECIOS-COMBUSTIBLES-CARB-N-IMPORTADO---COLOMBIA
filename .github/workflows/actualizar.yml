name: Actualizar monitor

on:
  schedule:
    - cron: "17 12 * * 1"      # lunes 07:17 hora de Lima
  workflow_dispatch:
    inputs:
      sin_agente:
        description: "Omitir el análisis con Claude"
        type: boolean
        default: false
  push:
    paths:
      - "data/manual/**"        # al cargar cotizaciones nuevas se regenera el reporte
      - "config/**"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar datos y generar reporte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/reports/ultimo_reporte.md
        run: python -m monitor all ${{ inputs.sin_agente && '--sin-agente' || '' }}

      - name: Publicar resumen
        run: cat reports/ultimo_reporte.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar histórico y reporte
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico reports
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática $(date -u +%Y-%m-%d)"
            git push
          fi
