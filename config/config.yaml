# =============================================================================
# Monitor de carbón importado — origen Colombia, destino Puerto Conchán (Perú)
#
# Los valores marcados con "AJUSTAR" son supuestos iniciales: reemplázalos por
# los de tus contratos / cotizaciones reales. Todo está en USD salvo que se
# indique lo contrario.
# =============================================================================

destino:
  puerto: "Conchán, Lima (PE)"
  # Costos portuarios y de internamiento en Conchán (USD/t)  — AJUSTAR
  costos_portuarios_usd_t:
    descarga_y_manipuleo: 6.0
    almacenaje: 1.5
    transporte_a_planta: 4.0
  agente_aduanas_pct: 0.35        # % sobre valor CIF                — AJUSTAR
  seguro_pct: 0.15                # % sobre (FOB + flete) si no viene en CIF
  igv_pct: 18.0                   # IGV + IPM (crédito fiscal; sólo flujo de caja)

carbon:
  nombre: "Carbón térmico — origen Colombia"
  origen: "Colombia (Puerto Nuevo / Santa Marta / Pto. Drummond)"
  hs: "270112"                    # Hulla bituminosa
  poder_calorifico_ref_kcal_kg: 6000   # base de los índices (NAR) — API2 y Newcastle ~6000 NAR
  poder_calorifico_spec_kcal_kg: 6000  # spec de tu contrato (NAR)  — AJUSTAR
  arancel_pct: 0.0
  consumo_anual_t: 250000         # para medir impacto anual                — AJUSTAR
  presupuesto_landed_usd_t: 160   # costo puesto en planta presupuestado   — AJUSTAR
  # Flete Colombia -> Conchán vía Canal de Panamá (Supramax/Panamax)
  flete:
    base_usd_t: 24.0              # flete de referencia con Brent = brent_base — AJUSTAR
    brent_base_usd_bbl: 80.0
    elasticidad_bunker: 0.45      # % de cambio del flete por % de cambio del Brent
  # Ratios FOB Colombia / índice, usados sólo si no hay datos para calibrarlos.
  # Se recalibran automáticamente con UN Comtrade (mediana últimos 12 meses).
  ratio_colombia_api2_default: 0.85       # API2 es CIF Rotterdam: incluye flete al ARA
  ratio_colombia_newcastle_default: 0.88
  benchmark_preferido: "api2"     # api2 | newcastle  (el carbón colombiano es del Atlántico)

# CSV descargados de Investing.com ("Datos históricos" -> Descargar) y guardados en
# data/manual/investing/. El nombre del archivo decide la serie (palabra clave).
investing:
  carpeta: "data/manual/investing"
  series:
    api2: carbon_api2_cif_ara
    rotterdam: carbon_api2_cif_ara
    newcastle: carbon_newcastle_futuro
    richards: carbon_api4_fob_rb
    api4: carbon_api4_fob_rb

# Alertas
alertas:
  variacion_mensual_pct: 8.0      # alerta si un precio clave se mueve más que esto (MoM)
  zscore: 2.0                     # alerta si el último dato se aleja > N desviaciones (24m)
  margen_presupuesto_pct: 0.0     # alerta si landed > presupuesto * (1 + margen)

# Fuentes públicas (todas gratuitas). Claves opcionales via variables de entorno.
fuentes:
  inicio: "2019-01"               # primer mes a descargar
  fred: true                      # Newcastle (IMF), Brent, USD/COP
  banco_mundial: true             # Pink Sheet: carbón Australia/Sudáfrica/Colombia
  bcrp: true                      # Tipo de cambio PEN/USD (BCRP)
  comtrade: true                  # Valores unitarios CIF Perú / FOB Colombia
  comtrade_meses: 24              # cuántos meses hacia atrás consultar en Comtrade
  investing: true                 # CSV de Investing en data/manual/investing
  manual: true                    # data/manual/*.csv (tus cotizaciones y fletes)

# Agente analista (Claude). Requiere ANTHROPIC_API_KEY; si no está, se omite.
agente:
  habilitado: true
  modelo: "claude-opus-5-5"
  esfuerzo: "high"                # low | medium | high | xhigh | max
  busqueda_web: true              # permite buscar noticias públicas recientes
  max_busquedas: 6

# Notificación por Telegram (opcional): TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID
notificaciones:
  telegram: true
